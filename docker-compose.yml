services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: caiso
      POSTGRES_PASSWORD: caiso_dev
      POSTGRES_DB: caiso
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
volumes:
  pgdata:
